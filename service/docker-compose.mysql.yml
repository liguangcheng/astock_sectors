# MySQL 8.4（阶段二用；当前阶段一使用 SQLite，无需启动）
# 启动： docker compose -f docker-compose.mysql.yml up -d
# 停止： docker compose -f docker-compose.mysql.yml down
# 清空： docker compose -f docker-compose.mysql.yml down -v
services:
  mysql:
    image: mysql:8.4
    container_name: astock-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"          # 映射 3307，避免与本机 3306 冲突
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-astock-root}
      MYSQL_DATABASE: astock
      MYSQL_USER: astock
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-astock-pass}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-astock-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
